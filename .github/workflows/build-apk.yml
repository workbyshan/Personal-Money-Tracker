name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets & Capacitor Config
        run: |
          mkdir -p dist

          # Auto-detect whether the file is named personal_money_tracker.html or index.html
          if [ -f "personal_money_tracker.html" ]; then
            cp personal_money_tracker.html dist/index.html
          elif [ -f "index.html" ]; then
            cp index.html dist/index.html
          else
            echo "ERROR: Could not find personal_money_tracker.html or index.html in the repo root!"
            ls -la
            exit 1
          fi

          # Create non-interactive package.json
          cat << 'EOF' > package.json
          {
            "name": "money-tracker",
            "version": "1.0.0",
            "private": true
          }
          EOF

          # Create non-interactive capacitor config
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.tracker.money",
            "appName": "Money Tracker",
            "webDir": "dist"
          }
          EOF

          # Install Capacitor CLI & native platform
          npm install --save @capacitor/core @capacitor/cli @capacitor/android

          # Initialize Android project and sync HTML assets
          npx cap add android
          npx cap sync android

      - name: Accept Android Licenses & Build Debug APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
