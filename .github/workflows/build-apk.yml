name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Prepare Assets & Install Capacitor
        run: |
          mkdir -p dist
          # Find and copy your HTML tracker
          if [ -f "personal_money_tracker.html" ]; then
            cp personal_money_tracker.html dist/index.html
          elif [ -f "index.html" ]; then
            cp index.html dist/index.html
          else
            echo "Error: Neither personal_money_tracker.html nor index.html was found in root!"
            ls -la
            exit 1
          fi

          # Create package.json and capacitor configuration directly to avoid prompt hanging
          cat << 'EOF' > package.json
          {
            "name": "money-tracker",
            "version": "1.0.0",
            "private": true
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.tracker.money",
            "appName": "Money Tracker",
            "webDir": "dist"
          }
          EOF

          # Install locked Capacitor dependencies
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Add native android project non-interactively
          npx cap add android
          npx cap sync android

      - name: Accept Android Licenses & Build APK
        run: |
          # Auto-accept all android sdk licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
