name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Prepare Web Assets & Initialize Capacitor
        run: |
          mkdir -p dist
          # Copy whatever html file exists to dist/index.html
          if [ -f "index.html" ]; then
            cp index.html dist/index.html
          elif [ -f "personal_money_tracker.html" ]; then
            cp personal_money_tracker.html dist/index.html
          else
            echo "No HTML file found!" && exit 1
          fi

          # Initialize project properly
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init "Money Tracker" "com.tracker.money" --web-dir dist
          npx cap add android
          npx cap copy

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyTracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
